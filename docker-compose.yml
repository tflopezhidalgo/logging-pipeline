version: '3'

services:
  server:
    build: ./server
    image: server:latest
    container_name: server
    environment:
      - PYTHONUNBUFFERED=1
      - SERVER_PORT=12345
      - SERVER_LISTEN_BACKLOG=7
      - LOGGING_LEVEL=DEBUG
    networks:
      - logging_pipeline_net

  client:
    build: ./client
    image: client:latest
    container_name: client
    environment:
      - PYTHONUNBUFFERED=1
      - CLI_ID=1
      - CLI_SERVER_ADDRESS=server:12345
      - CLI_LOOP_LAPSE=1m2s
      - CLI_LOG_LEVEL=DEBUG
    networks:
      - logging_pipeline_net
    depends_on:
      - server

networks:
  logging_pipeline_net:
    ipam:
      driver: default
      config:
        - subnet: 172.25.125.0/24
